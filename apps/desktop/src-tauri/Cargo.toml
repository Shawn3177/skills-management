[package]
name = "skills-manage-desktop"
version = "0.1.0"
description = "Local-first desktop skills manager"
authors = ["Shawn3177"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "skills_manage_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decodes files read through the git blobs API (paths GitHub archives leave out).
base64 = "0.22"
# Only Deflate is used; the default features pull in C codecs (bzip2, lzma, zstd).
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# Git blob ids are SHA-1; used to recognise a skill's exact upstream version.
sha1 = "0.10"
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"
# The GitHub token the user connects is kept in the OS credential store
# (Windows Credential Manager, macOS Keychain, Linux keyutils), never in a file.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

