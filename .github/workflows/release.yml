name: Release

# Pushing a tag such as v0.2.0 builds, signs and publishes the release.
# Installed copies check releases/latest/download/latest.json on launch,
# so a published (not draft) release is what reaches them.
# A manual run only builds and keeps the files as workflow artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "$env:GITHUB_REF_NAME".TrimStart("v")
          $conf = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $npm = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path apps/desktop/src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($conf -ne $tag -or $npm -ne $tag -or $cargo -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME does not match the app version (tauri.conf.json $conf, package.json $npm, Cargo.toml $cargo)."
          }

      - name: Check the signing key is set
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "The TAURI_SIGNING_PRIVATE_KEY secret is not set. See Releasing in README.md."
          }

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Test frontend
        working-directory: apps/desktop
        run: npm test -- --run

      - name: Test backend
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          # Signs the installers and writes the .sig files the updater checks.
          args: --config src-tauri/tauri.updater.conf.json
          # Empty on a manual run, so nothing is published.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Skills Manage ${{ github.ref_name }}
          releaseBody: |
            Windows: download `Skills Manage_*_x64-setup.exe` and run it.
            Copies from 0.2.0 on find later versions themselves when they start (Settings > Version > Check for updates).
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          # Existing installs use the per-user setup.exe, so latest.json points the updater at it.
          updaterJsonPreferNsis: true

      - name: Build portable ZIP
        working-directory: apps/desktop
        run: npm run package:portable

      - name: Attach portable ZIP to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/portable/*.zip
          gh release upload "$env:GITHUB_REF_NAME" $zip.FullName --clobber

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skills-manage-windows
          if-no-files-found: warn
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/msi/*.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/*setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/portable/*.zip
